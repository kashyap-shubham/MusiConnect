name: Deploy API

on:
  workflow_run:
    workflows: ["API CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/musiconnect-api:latest

            docker stop musiconnect-api || true
            docker rm musiconnect-api || true

            docker run -d \
              --name musiconnect-api \
              --restart always \
              -p 3001:3001 \
              --env-file /home/ubuntu/.env \
              ${{ secrets.DOCKER_USERNAME }}/musiconnect-api:latest